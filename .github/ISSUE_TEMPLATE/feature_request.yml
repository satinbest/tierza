name: Feature Request
description: Suggest an enhancement or new B2B pricing feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues and PRD milestones before suggesting a new feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific business or merchant problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
